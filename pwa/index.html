<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#176b52" />
  <meta name="description" content="Personalized diet and daily routine recommendation system." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Daylight Wellness</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark">P</div>
      <div class="brand-copy"><strong>DAYLIGHT</strong><small>Personal wellness</small></div>
      <span class="sync">● Offline ready</span>
      <button class="icon-btn theme-btn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">🌙</button>
      <button class="avatar" id="profileButton" aria-label="Open profile and account">AS</button>
    </header>

    <section class="view" id="app"></section>

    <!-- Floating AI Wellness Assistant Trigger -->
    <button class="ai-fab" id="aiFab" aria-label="Open AI Wellness Assistant" title="Chat with Daylight AI Coach">
      <span class="ai-fab-icon">✨</span>
      <span class="ai-fab-text">AI Coach</span>
    </button>

    <nav class="bottom-nav" aria-label="Primary navigation" id="bottomNav">
      <button class="nav-button active" data-view="today">Today</button>
      <button class="nav-button" data-view="plan">Plan</button>
      <button class="nav-button" data-view="track">Track</button>
      <button class="nav-button" data-view="grocery">Grocery</button>
      <button class="nav-button" data-view="profile">Profile</button>
      <button class="nav-button admin-nav-btn" data-view="admin" style="display:none;" id="adminNavBtn">⚙️ Admin</button>
    </nav>
  </main>

  <!-- Profile, Auth & Action Dialog -->
  <dialog id="profileDialog"></dialog>

  <!-- AI Wellness Assistant Chat Dialog -->
  <dialog id="aiDialog" class="ai-dialog-modal"></dialog>

  <script src="app.js"></script>
</body>
</html>
